{% extends "admin/base.html" %}
{% set active = 'contracts' %}
{% block title %}Edit Contract{% endblock %}

{% block content %}
<h2>Edit Contract <code>{{ c['reference'] }}</code></h2>
<p class="section-sub">
  Editing this contract only — the template it came from is untouched.
</p>

<form method="POST" class="form form-wide">
  <label>Title
    <input type="text" name="title" value="{{ c['title'] }}">
  </label>
  <label>Terms &amp; Conditions
    <textarea name="body" rows="22">{{ c['body'] }}</textarea>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn">Save Contract</button>
    <a href="{{ url_for('view_contract', contract_id=c['id']) }}" class="btn btn-grey">Cancel</a>
  </div>
</form>
{% endblock %}
